<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | AI WiFi Bruteforce</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #030406;
        --panel-bg: rgba(13, 17, 23, 0.9);
        --accent: #ff0055;
        --ai-accent: #00d9ff;
        --success: #00ffa3;
        --text-primary: #e2e8f0;
        --text-secondary: #64748b;
        --border-color: rgba(255, 0, 85, 0.2);
        --glass: blur(14px);
      }
      * {
        box-sizing: border-box;
        transition: all 0.2s ease;
      }
      body {
        font-family: "Outfit", sans-serif;
        background-color: var(--bg);
        background-image: radial-gradient(
          circle at 50% -20%,
          rgba(255, 0, 85, 0.1) 0%,
          transparent 60%
        );
        color: var(--text-primary);
        margin: 0;
        padding: 2.5rem;
      }
      .header-container {
        max-width: 1200px;
        margin: 0 auto 2rem auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      nav a {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.75rem;
        font-weight: 700;
        margin: 0 1rem;
      }
      nav a.active {
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
        padding-bottom: 4px;
      }
      .content-area {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 2rem;
      }
      .panel-glass {
        background: var(--panel-bg);
        backdrop-filter: var(--glass);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      }
      h2 {
        color: var(--accent);
        font-size: 1.2rem;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-start {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 15px 24px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
        box-shadow: 0 5px 15px rgba(255, 0, 85, 0.3);
        font-size: 1rem;
      }
      .btn-start:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-stop {
        background: #ff0000;
        color: #fff;
        border: 2px solid #fff;
        padding: 15px 24px;
        border-radius: 8px;
        font-weight: 900;
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
        box-shadow: 0 0 30px #ff0000;
        font-size: 1.1rem;
        letter-spacing: 2px;
      }
      .ai-terminal {
        background: #000;
        border-radius: 8px;
        padding: 15px;
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        color: var(--ai-accent);
        height: 200px;
        overflow-y: auto;
        margin-top: 1rem;
        border: 1px solid rgba(0, 217, 255, 0.3);
      }
      .ai-terminal line {
        display: block;
        margin-bottom: 4px;
        border-left: 2px solid var(--ai-accent);
        padding-left: 8px;
      }
      .progress-container {
        margin-top: 2rem;
        background: rgba(255, 255, 255, 0.05);
        height: 12px;
        border-radius: 6px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--ai-accent));
        width: 0%;
        box-shadow: 0 0 15px var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th {
        text-align: left;
        font-size: 0.65rem;
        color: var(--text-secondary);
        padding: 10px;
      }
      td {
        padding: 12px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.85rem;
      }
      .ssid-item:hover {
        background: rgba(255, 0, 85, 0.05);
        cursor: pointer;
      }
      .selected {
        background: rgba(255, 0, 85, 0.1) !important;
        border-left: 4px solid var(--accent);
      }
      #status-banner {
        background: #ff0000;
        color: white;
        text-align: center;
        font-weight: 900;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="status-banner">ATTACK IN PROGRESS - SYSTEM LOCKED</div>

    <div class="header-container">
      <div class="brand"><h1>AI BRUTEFORCE</h1></div>
      <nav>
        <a href="/">DASHBOARD</a>
        <a href="/bruteforce" class="active">BRUTEFORCE</a>
        <a href="/manual">HANDBOOK</a>
      </nav>
      <div
        id="ai-status-glow"
        style="
          color: var(--text-secondary);
          font-size: 0.7rem;
          font-weight: 700;
          padding: 4px 10px;
          border: 1px solid currentColor;
          border-radius: 4px;
        "
      >
        NEURAL_STANDBY
      </div>
    </div>

    <div class="content-area">
      <div class="panel-glass">
        <h2>Target Reconnaissance</h2>
        <table>
          <thead>
            <tr>
              <th>SSID</th>
              <th>BSSID</th>
              <th>SIGNAL</th>
              <th>SEC</th>
            </tr>
          </thead>
          <tbody id="wifi-list"></tbody>
        </table>
      </div>

      <div class="panel-glass">
        <div id="control-panel">
          <h2>Neural Attack Control</h2>
          <select
            id="attack-mode"
            style="
              width: 100%;
              background: #000;
              color: #fff;
              border: 1px solid var(--ai-accent);
              padding: 10px;
              border-radius: 4px;
              font-family: &quot;Space Mono&quot;;
              font-size: 0.8rem;
              margin-bottom: 1rem;
            "
          >
            <option value="AI">AI Smart Guessing (Neural)</option>
            <option value="DICTIONARY">Standard Dictionary</option>
            <option value="EXHAUSTIVE">Infinite Brute Force (All)</option>
          </select>
          <div
            id="target-info"
            style="
              margin-bottom: 1rem;
              font-size: 0.9rem;
              color: var(--text-secondary);
            "
          >
            Select a network to begin.
          </div>

          <button
            id="start-btn"
            class="btn-start"
            disabled
            onclick="startAttack()"
          >
            EXECUTE ATTACK
          </button>
          <button
            id="stop-btn"
            class="btn-stop"
            style="display: none"
            onclick="stopAttack()"
          >
            STOP ATTACK (TERMINATE)
          </button>
        </div>

        <div id="active-panel" style="display: none; margin-top: 2rem">
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-family: &quot;Space Mono&quot;, monospace;
              font-size: 0.8rem;
            "
          >
            <span style="color: var(--text-secondary)">STATUS:</span>
            <span id="current-pwd" style="color: #fff; font-weight: 700"
              >-</span
            >
          </div>
          <div class="progress-container">
            <div id="progress" class="progress-bar"></div>
          </div>
          <div
            style="
              text-align: right;
              margin-top: 5px;
              font-family: &quot;Space Mono&quot;;
              font-size: 0.75rem;
              color: var(--ai-accent);
            "
          >
            <span id="percent">0</span>% PERSISTENCE
          </div>
          <div class="ai-terminal" id="terminal">
            <line>Initializing...</line>
          </div>
        </div>

        <div
          id="result-panel"
          style="
            display: none;
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(0, 255, 163, 0.1);
            border: 1px solid var(--success);
            border-radius: 12px;
            text-align: center;
          "
        >
          <div
            style="
              font-size: 0.65rem;
              color: var(--success);
              text-transform: uppercase;
              letter-spacing: 2px;
            "
          >
            VULNERABILITY CONFIRMED
          </div>
          <div
            id="key-found"
            style="
              font-size: 1.5rem;
              font-family: &quot;Space Mono&quot;;
              font-weight: 700;
              color: #fff;
            "
          >
            -
          </div>
        </div>
      </div>
    </div>

    <script>
      let selectedSsid = null;
      let lastLogsCount = 0;

      async function updateList() {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();
          const list = document.getElementById("wifi-list");
          list.innerHTML = "";
          data.networks.forEach((net) => {
            const tr = document.createElement("tr");
            tr.className =
              "ssid-item " + (selectedSsid === net.ssid ? "selected" : "");
            tr.onclick = () => {
              selectedSsid = net.ssid;
              document.getElementById("start-btn").disabled = false;
              document.getElementById("target-info").innerHTML =
                `TARGET: <span style="color: var(--ai-accent)">${net.ssid}</span>`;
              updateList();
            };
            tr.innerHTML = `<td>${net.ssid}</td><td>${net.bssids[0].mac}</td><td>${net.bssids[0].signal}%</td><td>WPA2</td>`;
            list.appendChild(tr);
          });
        } catch (e) {}
      }

      async function startAttack() {
        if (!selectedSsid) return;
        const mode = document.getElementById("attack-mode").value;
        await fetch("/api/brute/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ssid: selectedSsid, mode: mode }),
        });
        lastLogsCount = 0;
        document.getElementById("terminal").innerHTML =
          "<line>System Override Engaged...</line>";
        pollStatus();
      }

      async function stopAttack() {
        document.getElementById("stop-btn").disabled = true;
        document.getElementById("stop-btn").innerText = "TERMINATING...";
        await fetch("/api/brute/stop", { method: "POST" });
      }

      async function pollStatus() {
        try {
          const res = await fetch("/api/brute/status");
          const data = await res.json();

          if (data.is_running) {
            document.getElementById("status-banner").style.display = "block";
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("stop-btn").style.display = "block";
            document.getElementById("stop-btn").disabled = false;
            document.getElementById("stop-btn").innerText =
              "STOP ATTACK (TERMINATE)";
            document.getElementById("active-panel").style.display = "block";
            document.getElementById("ai-status-glow").innerText =
              "ATTACK_ACTIVE";
            document.getElementById("ai-status-glow").style.color = "#ff0000";

            document.getElementById("progress").style.width =
              data.progress + "%";
            document.getElementById("percent").innerText = data.progress;
            document.getElementById("current-pwd").innerText =
              `${data.current_password}`;

            if (data.ai_logs && data.ai_logs.length > lastLogsCount) {
              const terminal = document.getElementById("terminal");
              data.ai_logs.slice(lastLogsCount).forEach((log) => {
                const line = document.createElement("line");
                line.innerText = log;
                terminal.appendChild(line);
              });
              terminal.scrollTop = terminal.scrollHeight;
              lastLogsCount = data.ai_logs.length;
            }
            setTimeout(pollStatus, 1000);
          } else {
            document.getElementById("status-banner").style.display = "none";
            document.getElementById("start-btn").style.display = "block";
            document.getElementById("stop-btn").style.display = "none";
            document.getElementById("ai-status-glow").innerText =
              "NEURAL_STANDBY";
            document.getElementById("ai-status-glow").style.color =
              "var(--text-secondary)";

            if (
              data.ai_logs &&
              data.ai_logs.some((l) => l.includes("SUCCESS"))
            ) {
              document.getElementById("active-panel").style.display = "none";
              document.getElementById("result-panel").style.display = "block";
              document.getElementById("key-found").innerText =
                data.current_password;
            }
          }
        } catch (e) {
          setTimeout(pollStatus, 2000);
        }
      }

      setInterval(updateList, 5000);
      updateList();
      pollStatus();
    </script>
  </body>
</html>
